<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  :root{--bg:#0b1220;--ink:#e8eef9;--muted:#90a0bd;--accent:#4cc2ff;--accent2:#7af0c0;--user:#2b6fed;--bot:#16223e;--ok:#3ad29f;--line:#22304f;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  html,body{width:1200px;height:675px;background:#070c16;color:var(--ink);overflow:hidden}
  .stage{position:relative;width:1200px;height:675px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0b1322,#080d18)}
  .chead{display:flex;align-items:center;gap:13px;padding:14px 28px;border-bottom:1px solid var(--line);background:#0d1730;z-index:2}
  .avatar{width:42px;height:42px;border-radius:50%;background:#eaf4ff;border:1px solid #cfe4f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .chead .nm{font-weight:700;font-size:17px}.chead .st{font-size:12.5px;color:var(--muted)}
  .chead .right{margin-left:auto;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .msgs{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:22px 120px 66px 28px;overflow:hidden}
  .turn{display:flex;flex-direction:column;max-width:74%;overflow:hidden;will-change:max-height,opacity,transform}
  .turn.me{align-self:flex-end;align-items:flex-end}.turn.bot{align-self:flex-start;align-items:flex-start}
  .turn.wide{max-width:84%}
  .who{font-size:11.5px;color:var(--muted);margin:0 6px 3px}
  .bubble{padding:11px 15px;border-radius:16px;font-size:15px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.22)}
  .me .bubble{background:var(--user);border-bottom-right-radius:5px}
  .bot .bubble{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bubble ul{margin:7px 0 2px;padding-left:18px}.bubble li{margin:3px 0}
  .bubble .note{display:block;margin-top:9px;font-size:13px;color:var(--accent2)}
  .time{font-size:10.5px;color:var(--muted);margin:3px 8px 0}
  .file{margin-top:10px;display:inline-flex;align-items:center;gap:9px;background:#0b1530;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
  .file .ic{width:26px;height:26px;border-radius:7px;background:#13224a;display:flex;align-items:center;justify-content:center}
  .file .fn{font-weight:600}.file .sz{color:var(--muted);font-size:11.5px}
  .file.deliver{border-color:#2b6f9e;background:#0c1b33}
  .typing{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}
  .pulse{display:inline-flex;gap:4px}.pulse i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  table{border-collapse:collapse;width:100%;margin-top:7px;font-size:13.5px}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .verdict{color:var(--ok);font-weight:700;white-space:nowrap}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px;background:radial-gradient(1200px 600px at 50% 32%,#13224a,#0a0f1f);z-index:5}
  .logo-lg{width:80px;height:80px;border-radius:20px;background:#eaf4ff;border:1px solid #cfe4f5;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
  .big{font-size:42px;font-weight:800;letter-spacing:.2px;max-width:1000px;line-height:1.14}
  .sub{font-size:21px;color:var(--accent);margin-top:14px;font-weight:600}
  .desc{font-size:17px;color:var(--muted);margin-top:18px;max-width:780px;line-height:1.5}
  .try{margin-top:24px;font-size:15px;background:#0f1830;border:1px solid var(--line);border-radius:12px;padding:14px 18px;max-width:780px}.try b{color:var(--accent2)}
  .join{margin-top:24px;font-size:17px;font-weight:700;color:#06243b;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:14px 26px;border-radius:12px}
  .handle{margin-top:12px;font-size:14px;color:var(--muted)}.handle b{color:var(--accent)}
  .report-cap{margin-bottom:13px;color:var(--muted);font-size:14px}.report-cap b{color:var(--accent)}
  .report{width:820px;background:#0e1726;border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.55);overflow:hidden;text-align:left}
  .rhead{display:flex;align-items:center;gap:12px;padding:15px 22px;background:linear-gradient(90deg,#13224a,#0e1726);border-bottom:1px solid var(--line)}
  .rlogo{width:32px;height:32px;border-radius:9px;background:#eaf4ff;border:1px solid #cfe4f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .avatar .mk{width:30px;height:30px}.logo-lg .mk{width:56px;height:56px}.rlogo .mk{width:23px;height:23px}
  .cap{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);max-width:620px;text-align:center;background:rgba(8,14,26,.74);border:1px solid var(--line);color:var(--ink);font-size:16.5px;font-weight:600;padding:9px 20px;border-radius:999px;z-index:6;opacity:0}
  .rtitle{font-size:16px;font-weight:700}.rsub{font-size:11.5px;color:var(--muted)}
  .rtab{margin-left:auto;display:flex;gap:6px}
  .rtab span{font-size:11px;color:var(--muted);padding:4px 9px;border:1px solid var(--line);border-radius:999px}
  .rtab span.on{color:#06243b;background:var(--accent2);border-color:var(--accent2);font-weight:700}
  .rwin{height:340px;overflow:hidden;position:relative}.rscroll{padding:18px 22px}
  .rsec{padding-bottom:18px}.rsec h4{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--accent);margin-bottom:10px}
  .rsec .kv{font-size:13.5px;color:var(--ink);line-height:1.7}
  .rsec .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted)}
  .rfoot{padding:10px 22px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="dhmark" viewBox="-8 2 246 216"><path d="M0 10h130c58 0 100 42 100 100s-42 100-100 100H0z" fill="#0B3D91"/><path d="M38 72c20-32 64-32 84 0v76c-20 32-64 32-84 0z" fill="#2BB2A6" opacity=".9"/><path d="M30 140c12 16 31 26 55 26s43-10 55-26" fill="none" stroke="#6FE8D4" stroke-width="6" stroke-linecap="round"/><path d="M30 110c12 16 31 26 55 26s43-10 55-26" fill="none" stroke="#12A6B0" stroke-width="6" stroke-linecap="round" opacity=".7"/><path d="M30 80c12 16 31 26 55 26s43-10 55-26" fill="none" stroke="#0B3D91" stroke-width="6" stroke-linecap="round" opacity=".45"/><rect x="18" y="48" width="20" height="120" fill="#0B3D91"/><path d="M16 52c0-6.6 5.4-12 12-12s12 5.4 12 12-5.4 12-12 12-12-5.4-12-12z" fill="#0B3D91"/></symbol></defs></svg>
<div class="stage">
  <div class="chead"><div class="avatar"><svg class="mk"><use href="#dhmark"/></svg></div><div><div class="nm" id="ch-name"></div><div class="st">Open Deck · Deckhand is online</div></div><div class="right" id="ch-tags"></div></div>
  <div class="msgs" id="msgs"></div>
</div>
<div class="cap" id="cap"></div>
<div class="overlay" id="titlecard"><div class="logo-lg"><svg class="mk"><use href="#dhmark"/></svg></div><div class="big" id="ti-big"></div><div class="sub" id="ti-sub"></div><div class="desc" id="ti-desc"></div></div>
<div class="overlay" id="reportcard">
  <div class="report-cap">📄 The report you get back — <b id="rsecname">Inputs</b></div>
  <div class="report">
    <div class="rhead"><div class="rlogo"><svg class="mk"><use href="#dhmark"/></svg></div><div><div class="rtitle" id="r-title"></div><div class="rsub" id="r-sub"></div></div>
      <div class="rtab"><span id="tab-inputs">Inputs</span><span id="tab-method">Methodology</span><span id="tab-outputs">Outputs</span></div></div>
    <div class="rwin" id="rwin"><div class="rscroll">
      <div class="rsec" id="sec-inputs"></div><div class="rsec" id="sec-method"></div><div class="rsec" id="sec-outputs"></div>
    </div></div>
    <div class="rfoot"><span>Generated by Deckhand</span><span id="r-foot"></span></div>
  </div>
</div>
<div class="overlay" id="closecard"><div class="logo-lg"><svg class="mk"><use href="#dhmark"/></svg></div><div class="big" id="cl-big"></div>
  <div class="desc">No spreadsheets, no setup. Just ask, in plain English.</div>
  <div class="try">Try asking: <b id="cl-try"></b></div><div class="join">Start on Deckhand →</div>
  <div class="handle">message <b>@the_deckhand_bot</b> · <span id="cl-route"></span></div></div>

<script>
var SPEC = SPEC_PLACEHOLDER;
function el(id){return document.getElementById(id);}
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// ---- build DOM from SPEC ----
el('ch-name').textContent=SPEC.channel.name;
el('ch-tags').textContent=SPEC.channel.tags;
el('ti-big').textContent=SPEC.title.big;
el('ti-sub').textContent='Deckhand · '+SPEC.channel.name;
el('ti-desc').textContent=SPEC.title.desc;
el('r-title').textContent=SPEC.report.title;
el('r-sub').textContent=SPEC.report.sub;
el('r-foot').textContent=SPEC.report.foot;
el('sec-inputs').innerHTML='<h4>Inputs</h4>'+SPEC.report.inputs;
el('sec-method').innerHTML='<h4>Methodology</h4>'+SPEC.report.methodology;
el('sec-outputs').innerHTML='<h4>Outputs</h4>'+SPEC.report.outputs;
el('cl-big').textContent=SPEC.closing.headline;
el('cl-try').textContent=SPEC.closing.tryThis;
el('cl-route').textContent="we'll point you to "+SPEC.closing.route;

var msgs=el('msgs');
SPEC.turns.forEach(function(tn,i){
  var d=document.createElement('div');
  d.className='turn '+tn.side+(tn.wide?' wide':''); d.id='t-'+i;
  if(tn.typing){ d.innerHTML='<div class="who">Deckhand</div><div class="bubble"><span class="typing">typing<span class="pulse"><i></i><i></i><i></i></span></span></div>'; }
  else {
    var who=tn.side==='me'?'You':'Deckhand';
    var fileHtml='';
    if(tn.file){ var cls=tn.file.deliver?'file deliver':'file'; var ic=tn.file.deliver?'📄':'📎';
      fileHtml='<span class="'+cls+'" style="margin-top:10px"><span class="ic">'+ic+'</span><span><span class="fn">'+tn.file.name+'</span> · <span class="sz">'+tn.file.size+'</span></span></span>'; }
    d.innerHTML='<div class="who">'+who+'</div><div class="bubble">'+tn.html+fileHtml+'</div><div class="time">'+(tn.time||'')+'</div>';
  }
  msgs.appendChild(d);
});

// ---- schedule ----
var SP=SPEC.speed||1;  // >1 = faster (teaser); whole timeline scales uniformly
var ENTER=520/SP, RFADE=600/SP, SCROLL=800/SP, RH=(SPEC.report.hold||3000)/SP, TITLE_OUT=2800/SP, CHAT_START=3000/SP, CLOSE_HOLD=3500/SP;
var turns=SPEC.turns, cursor=CHAT_START;
turns.forEach(function(tn){ tn._in=cursor; var h=(tn.hold||(tn.typing?1200:3000))/SP; if(tn.typing) tn._out=cursor+h; cursor+=h; });
var reportIn=cursor+200/SP, a=reportIn+RFADE, inEnd=a+RH, toMet=inEnd+SCROLL, metEnd=toMet+RH, toOut=metEnd+SCROLL, outEnd=toOut+RH;
var reportOut=outEnd, closeIn=reportOut+RFADE, DURATION=closeIn+CLOSE_HOLD;
window.DURATION=DURATION;

var Hh={};
function measure(){ turns.forEach(function(tn,i){ var e=el('t-'+i); e.style.display='flex'; e.style.maxHeight='none'; e.style.opacity='0'; Hh[i]=e.offsetHeight; }); }

function seek(t){
  var tc=el('titlecard');
  var tfS=TITLE_OUT-RFADE; tc.style.opacity=t<tfS?1:Math.max(0,1-(t-tfS)/RFADE);
  tc.style.display=t<TITLE_OUT?'flex':'none';
  turns.forEach(function(tn,i){
    var e=el('t-'+i);
    var present=t>=tn._in && (tn._out==null || t<tn._out);
    if(!present){ e.style.display='none'; return; }
    e.style.display='flex';
    var p=ease(clamp((t-tn._in)/ENTER,0,1));
    e.style.opacity=p; e.style.maxHeight=(Hh[i]*p+(p>=1?60:0))+'px'; e.style.transform='translateY('+((1-p)*12)+'px)';
  });
  var rc=el('reportcard');
  if(t>=reportIn && t<closeIn){
    var o=t<a?(t-reportIn)/RFADE:(t>reportOut?Math.max(0,1-(t-reportOut)/RFADE):1);
    rc.style.display='flex'; rc.style.opacity=clamp(o,0,1);
    var win=el('rwin'), inp=el('sec-inputs').offsetTop, met=el('sec-method').offsetTop, out=el('sec-outputs').offsetTop;
    var y=inp,name='Inputs',tab='tab-inputs';
    if(t<inEnd){y=inp;}
    else if(t<toMet){var p=ease((t-inEnd)/SCROLL);y=inp+(met-inp)*p;if(p>.5){name='Methodology';tab='tab-method';}}
    else if(t<metEnd){y=met;name='Methodology';tab='tab-method';}
    else if(t<toOut){var p2=ease((t-metEnd)/SCROLL);y=met+(out-met)*p2;if(p2>.5){name='Outputs';tab='tab-outputs';}else{name='Methodology';tab='tab-method';}}
    else {y=out;name='Outputs';tab='tab-outputs';}
    win.scrollTop=y; el('rsecname').textContent=name;
    ['tab-inputs','tab-method','tab-outputs'].forEach(function(x){el(x).classList.remove('on');}); el(tab).classList.add('on');
  } else { rc.style.display='none'; }
  var cc=el('closecard');
  if(t>=closeIn){cc.style.display='flex';cc.style.opacity=clamp((t-closeIn)/RFADE,0,1);} else {cc.style.display='none';}
  // silent-autoplay captions — generic, accurate phase labels (no per-spec authoring)
  var cap=el('cap'), ct='', cshow=false;
  if(t>=TITLE_OUT && t<reportIn){ ct=SPEC.caption||'Plain-English chat — no setup, no spreadsheets'; cshow=true; }
  else if(t>=reportIn && t<closeIn){
    if(t<inEnd){ ct='Your inputs, confirmed'; }
    else if(t<metEnd){ ct='The method — to the design code'; }
    else { ct='The answer — code-checked'; }
    cshow=true;
  }
  cap.textContent=ct; cap.style.opacity=cshow?1:0;
}
window.seek=seek;
measure();
var _tp=new URLSearchParams(location.search).get('t');
seek(_tp!==null?parseInt(_tp,10):0);
</script>
</body></html>
